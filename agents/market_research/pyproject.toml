[project]
name = "market_research"
version = "0.1.0"
description = "Deverout and Associates — Market Research & Transformation Strategy crew (CrewAI)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools,anthropic]>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
market_research = "market_research.main:run"
run_crew = "market_research.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_research"]

[tool.crewai]
type = "crew"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
